name: サイトの公開

# GitHub Pages にサイトを公開する。Settings → Pages の Source を「GitHub Actions」にしておく。
# 問題データの更新（build.yml）や監修の反映（review.yml）のあとにも呼ばれる。

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: 公開するファイルだけを集める
        run: |
          mkdir -p _site
          cp -r index.html css js data .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
